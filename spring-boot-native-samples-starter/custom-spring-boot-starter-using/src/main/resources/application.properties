spring.application.name=custom-spring-boot-starter-using
server.port=8080

# ===== 自定义 Starter 配置（custom.greeting.*）=====
# 是否启用整个 Starter（GreetingServiceAutoConfiguration 上的 @ConditionalOnBooleanProperty 读取，默认 true）
custom.greeting.enabled=true
# 问候语前缀 / 后缀（GreetingProperties 绑定）
custom.greeting.prefix=Hello
custom.greeting.suffix=!
# 是否注册大写装饰器（@ConditionalOnProperty 读取，默认 false）
custom.greeting.uppercase=false
# 使用方是否注册自定义 GreetingService（开启后自动配置因 @ConditionalOnMissingBean 回退，默认 false）
custom.greeting.custom-service-enabled=false
